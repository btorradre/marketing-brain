<svg viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison: Motilli works at the stomach, the old fiber and laxative stack works at the colon">
  <rect x="1" y="1" width="718" height="718" rx="18" fill="#f6faea" stroke="#e3ecc8"/>
  <text x="360" y="52" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.3" fill="#5c7a0c" text-anchor="middle">WHY THE FIBER &amp; LAXATIVES NEVER HAD A CHANCE</text>

  <!-- LEFT panel: MOTILLI (green) -->
  <rect x="30" y="76" width="312" height="612" rx="14" fill="#95c219"/>
  <text x="186" y="120" font-family="Merriweather,Georgia,serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">Motilli</text>
  <text x="186" y="144" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="0.5" fill="#eaf6cf" text-anchor="middle">celery juice fiber gummies</text>
  <line x1="50" y1="162" x2="322" y2="162" stroke="#ffffff" stroke-opacity="0.35"/>

  <!-- RIGHT panel: THE OLD STACK (white) -->
  <rect x="378" y="76" width="312" height="612" rx="14" fill="#ffffff" stroke="#e6ddcf"/>
  <text x="534" y="118" font-family="Merriweather,Georgia,serif" font-size="20" font-weight="900" fill="#8d877a" text-anchor="middle">The Old Stack</text>
  <text x="534" y="142" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#aaa295" text-anchor="middle">fiber · Miralax · probiotics</text>
  <line x1="398" y1="162" x2="670" y2="162" stroke="#ece4d6"/>

  <!-- rows: 5, centers at 214 300 386 472 558 -->
  <g font-family="Inter,Arial,sans-serif">
    <!-- row 1 -->
    <g>
      <circle cx="62" cy="206" r="11" fill="#ffffff"/><path d="M57 206 l4 4 l7 -8" fill="none" stroke="#6f9112" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="202" font-size="15.5" font-weight="600" fill="#ffffff">Works at the</text>
      <text x="84" y="222" font-size="15.5" font-weight="600" fill="#ffffff">stomach — upstream</text>
      <circle cx="410" cy="206" r="11" fill="#fbe6e3"/><path d="M406 202 l8 8 M414 202 l-8 8" stroke="#d63c2f" stroke-width="2.6" stroke-linecap="round"/>
      <text x="432" y="202" font-size="15.5" fill="#7a7068">Work at the</text>
      <text x="432" y="222" font-size="15.5" fill="#7a7068">colon — downstream</text>
    </g>
    <line x1="50" y1="250" x2="322" y2="250" stroke="#ffffff" stroke-opacity="0.3"/><line x1="398" y1="250" x2="670" y2="250" stroke="#f0e9dc"/>
    <!-- row 2 -->
    <g>
      <circle cx="62" cy="298" r="11" fill="#ffffff"/><path d="M57 298 l4 4 l7 -8" fill="none" stroke="#6f9112" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="294" font-size="15.5" font-weight="600" fill="#ffffff">Target the GLP-1</text>
      <text x="84" y="314" font-size="15.5" font-weight="600" fill="#ffffff">stomach slowdown</text>
      <circle cx="410" cy="298" r="11" fill="#fbe6e3"/><path d="M406 294 l8 8 M414 294 l-8 8" stroke="#d63c2f" stroke-width="2.6" stroke-linecap="round"/>
      <text x="432" y="294" font-size="15.5" fill="#7a7068">Ignore why you're</text>
      <text x="432" y="314" font-size="15.5" fill="#7a7068">backed up</text>
    </g>
    <line x1="50" y1="342" x2="322" y2="342" stroke="#ffffff" stroke-opacity="0.3"/><line x1="398" y1="342" x2="670" y2="342" stroke="#f0e9dc"/>
    <!-- row 3 -->
    <g>
      <circle cx="62" cy="390" r="11" fill="#ffffff"/><path d="M57 390 l4 4 l7 -8" fill="none" stroke="#6f9112" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="386" font-size="15.5" font-weight="600" fill="#ffffff">Wake stomach</text>
      <text x="84" y="406" font-size="15.5" font-weight="600" fill="#ffffff">motility (prokinetic)</text>
      <circle cx="410" cy="390" r="11" fill="#fbe6e3"/><path d="M406 386 l8 8 M414 386 l-8 8" stroke="#d63c2f" stroke-width="2.6" stroke-linecap="round"/>
      <text x="432" y="386" font-size="15.5" fill="#7a7068">Need an existing</text>
      <text x="432" y="406" font-size="15.5" fill="#7a7068">blockage to act on</text>
    </g>
    <line x1="50" y1="434" x2="322" y2="434" stroke="#ffffff" stroke-opacity="0.3"/><line x1="398" y1="434" x2="670" y2="434" stroke="#f0e9dc"/>
    <!-- row 4 -->
    <g>
      <circle cx="62" cy="482" r="11" fill="#ffffff"/><path d="M57 482 l4 4 l7 -8" fill="none" stroke="#6f9112" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="478" font-size="15.5" font-weight="600" fill="#ffffff">Low-bulk — won't</text>
      <text x="84" y="498" font-size="15.5" font-weight="600" fill="#ffffff">add to the jam</text>
      <circle cx="410" cy="482" r="11" fill="#fbe6e3"/><path d="M406 478 l8 8 M414 478 l-8 8" stroke="#d63c2f" stroke-width="2.6" stroke-linecap="round"/>
      <text x="432" y="478" font-size="15.5" fill="#7a7068">Add bulk to a</text>
      <text x="432" y="498" font-size="15.5" fill="#7a7068">jammed system</text>
    </g>
    <line x1="50" y1="526" x2="322" y2="526" stroke="#ffffff" stroke-opacity="0.3"/><line x1="398" y1="526" x2="670" y2="526" stroke="#f0e9dc"/>
    <!-- row 5 -->
    <g>
      <circle cx="62" cy="574" r="11" fill="#ffffff"/><path d="M57 574 l4 4 l7 -8" fill="none" stroke="#6f9112" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="570" font-size="15.5" font-weight="600" fill="#ffffff">One gummy,</text>
      <text x="84" y="590" font-size="15.5" font-weight="600" fill="#ffffff">three actions</text>
      <circle cx="410" cy="574" r="11" fill="#fbe6e3"/><path d="M406 570 l8 8 M414 570 l-8 8" stroke="#d63c2f" stroke-width="2.6" stroke-linecap="round"/>
      <text x="432" y="570" font-size="15.5" fill="#7a7068">A cabinet full of</text>
      <text x="432" y="590" font-size="15.5" fill="#7a7068">single fixes</text>
    </g>
  </g>

  <text x="360" y="662" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#5c7a0c" text-anchor="middle">Right ingredient. Right organ. Right problem.</text>
</svg>
