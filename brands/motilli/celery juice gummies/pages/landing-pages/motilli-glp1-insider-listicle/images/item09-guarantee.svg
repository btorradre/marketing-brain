<svg viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="90-day money-back guarantee: know within two weeks, send it back, no forms, no hassle">
  <rect x="1" y="1" width="718" height="718" rx="18" fill="#f6faea" stroke="#e3ecc8"/>
  <text x="360" y="64" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.4" fill="#5c7a0c" text-anchor="middle">TRY MOTILLI WITH ZERO RISK</text>

  <!-- SEAL -->
  <g transform="translate(360,250)">
    <circle r="138" fill="#95c219"/>
    <circle r="138" fill="none" stroke="#7ea30f" stroke-width="3" stroke-dasharray="3 10"/>
    <circle r="114" fill="#ffffff"/>
    <circle r="114" fill="none" stroke="#95c219" stroke-width="4"/>
    <text x="0" y="-18" font-family="Merriweather,Georgia,serif" font-size="86" font-weight="900" fill="#95c219" text-anchor="middle">90</text>
    <text x="0" y="20" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="5" fill="#5c7a0c" text-anchor="middle">DAY</text>
    <text x="0" y="50" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="0.5" fill="#1a1714" text-anchor="middle">MONEY-BACK</text>
    <text x="0" y="72" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="0.5" fill="#1a1714" text-anchor="middle">GUARANTEE</text>
    <g transform="translate(0,116)">
      <path d="M-92 -6 L92 -6 L92 30 L0 17 L-92 30 Z" fill="#74980f"/>
      <text x="0" y="19" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#fff" text-anchor="middle">RISK-FREE</text>
    </g>
  </g>

  <!-- reassurances -->
  <g font-family="Inter,Arial,sans-serif" font-size="18" fill="#1a1714">
    <circle cx="150" cy="476" r="13" fill="#95c219"/><path d="M144 476 l5 5 l8 -10" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="178" y="482">You'll know within the first two weeks if it's working.</text>
    <circle cx="150" cy="524" r="13" fill="#95c219"/><path d="M144 524 l5 5 l8 -10" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="178" y="530">If your stomach doesn't wake up, send it back.</text>
    <circle cx="150" cy="572" r="13" fill="#95c219"/><path d="M144 572 l5 5 l8 -10" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="178" y="578">No forms, no hassle — the risk is entirely on us.</text>
  </g>

  <text x="360" y="648" font-family="Inter,Arial,sans-serif" font-size="15" font-style="italic" fill="#7a7068" text-anchor="middle">After everything else that didn't work, you're right to be skeptical.</text>
</svg>
