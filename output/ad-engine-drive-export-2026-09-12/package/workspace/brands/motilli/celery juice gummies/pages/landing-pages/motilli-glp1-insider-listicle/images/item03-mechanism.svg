<svg viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How apigenin from celery supports the vagus nerve so the stomach contracts again">
  <rect x="1" y="1" width="718" height="718" rx="18" fill="#f6faea" stroke="#e3ecc8"/>
  <text x="360" y="58" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.2" fill="#5c7a0c" text-anchor="middle">HOW APIGENIN WAKES THE STOMACH BACK UP</text>

  <!-- STEP 1 -->
  <rect x="60" y="92" width="600" height="150" rx="14" fill="#ffffff" stroke="#e3ecc8"/>
  <circle cx="120" cy="167" r="34" fill="#eef7d8"/>
  <g transform="translate(120,167)">
    <path d="M-15 26 C-17 5 -13 -13 -8 -28" stroke="#7ea30f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M0 28 C0 5 0 -15 0 -32" stroke="#95c219" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M15 26 C17 5 13 -13 8 -28" stroke="#7ea30f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-8 -28 q8 -9 15 0 M0 -32 q9 -7 0 -15 M0 -32 q-9 -7 0 -15" stroke="#aacb4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="196" cy="118" r="15" fill="#95c219"/><text x="196" y="124" font-family="Merriweather,Georgia,serif" font-size="17" font-weight="900" fill="#fff" text-anchor="middle">1</text>
  <text x="226" y="160" font-family="Merriweather,Georgia,serif" font-size="22" font-weight="900" fill="#1a1714">Apigenin</text>
  <text x="226" y="190" font-family="Inter,Arial,sans-serif" font-size="16" fill="#4a4540">from concentrated, standardized celery juice</text>

  <!-- arrow -->
  <path d="M360 248 L360 276" stroke="#95c219" stroke-width="4" stroke-linecap="round"/>
  <path d="M352 269 L360 278 L368 269" fill="none" stroke="#95c219" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- STEP 2 -->
  <rect x="60" y="285" width="600" height="150" rx="14" fill="#ffffff" stroke="#e3ecc8"/>
  <circle cx="120" cy="360" r="34" fill="#eef7d8"/>
  <g transform="translate(120,360)">
    <path d="M0 -30 C-15 -17 15 -5 0 7 C-13 18 9 23 0 30" stroke="#95c219" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="-30" r="5.5" fill="#7ea30f"/><circle cx="0" cy="30" r="5.5" fill="#7ea30f"/>
    <path d="M20 -7 l9 -5 M22 2 l10 0 M20 11 l9 5" stroke="#aacb4a" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <circle cx="196" cy="311" r="15" fill="#95c219"/><text x="196" y="317" font-family="Merriweather,Georgia,serif" font-size="17" font-weight="900" fill="#fff" text-anchor="middle">2</text>
  <text x="226" y="353" font-family="Merriweather,Georgia,serif" font-size="22" font-weight="900" fill="#1a1714">The vagus nerve</text>
  <text x="226" y="383" font-family="Inter,Arial,sans-serif" font-size="16" fill="#4a4540">the signal your medication muted wakes back up</text>

  <!-- arrow -->
  <path d="M360 441 L360 469" stroke="#95c219" stroke-width="4" stroke-linecap="round"/>
  <path d="M352 462 L360 471 L368 462" fill="none" stroke="#95c219" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- STEP 3 -->
  <rect x="60" y="478" width="600" height="150" rx="14" fill="#ffffff" stroke="#e3ecc8"/>
  <circle cx="120" cy="553" r="34" fill="#eef7d8"/>
  <g transform="translate(120,553)">
    <path d="M2 -26 C-19 -23 -30 -5 -26 12 C-22 28 -3 31 11 26 C25 21 26 5 24 -7 C22 -19 16 -28 2 -26 Z" fill="#95c219" stroke="#6f9112" stroke-width="2.5"/>
    <path d="M-2 -26 L-5 -35" stroke="#7ea30f" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M31 -5 q9 7 0 16 M38 -10 q14 11 0 26" stroke="#7ea30f" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="196" cy="504" r="15" fill="#95c219"/><text x="196" y="510" font-family="Merriweather,Georgia,serif" font-size="17" font-weight="900" fill="#fff" text-anchor="middle">3</text>
  <text x="226" y="546" font-family="Merriweather,Georgia,serif" font-size="22" font-weight="900" fill="#1a1714">It moves again</text>
  <text x="226" y="576" font-family="Inter,Arial,sans-serif" font-size="16" fill="#4a4540">stomach muscles contract and food passes through</text>

  <!-- caption -->
  <text x="360" y="672" font-family="Inter,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#5c7a0c" text-anchor="middle">Not a laxative — physical therapy for a muscle that forgot how to move.</text>
</svg>
