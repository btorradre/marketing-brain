name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/engine/requirements.txt
      - name: Install runtime and test dependencies
        run: |
          python -m venv services/engine/.venv
          services/engine/.venv/bin/pip install -r services/engine/requirements.txt pytest==9.1.1
          sudo apt-get update
          sudo apt-get install -y postgresql-16 ffmpeg
      - name: Check source, server startup, unit tests and real Postgres behavior
        env:
          ADENGINE_TEST_PG_BIN: /usr/lib/postgresql/16/bin
        run: bash scripts/phase0_check.sh

  timeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/timeline
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
